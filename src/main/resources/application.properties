spring.application.name=scsms

# Server Configuration
server.port=8082

# MySQL Configuration
spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:reportissuedb}
spring.datasource.username=${RDS_USERNAME:root}
spring.datasource.password=${RDS_PASSWORD:password}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Enable server session timeout (30 minutes)
server.servlet.session.timeout=30m

# Enable session tracking with cookies
server.servlet.session.tracking-modes=cookie

